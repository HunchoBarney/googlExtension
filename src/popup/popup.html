<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polymarket Matches</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="rainbow-topbar">
        <form class="market-search" id="market-search-form" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16.2 16.2 4.3 4.3" />
          </svg>
          <input id="market-search-input" type="search" placeholder="Search markets" autocomplete="off" spellcheck="false" aria-label="Search markets">
          <button class="search-filter-button" id="market-search-button" type="submit" title="Search markets" aria-label="Search markets">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M4 17h16" />
              <path d="M9 7a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z" />
              <path d="M19 17a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z" />
            </svg>
          </button>
        </form>
        <div class="menu-wrap">
          <button class="menu-button" id="menu-button" type="button" title="Profile menu" aria-label="Profile menu" aria-haspopup="menu" aria-controls="action-menu" aria-expanded="false">
            <svg class="profile-avatar" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <defs>
                <radialGradient id="profile-avatar-shell" cx="36%" cy="18%" r="72%">
                  <stop offset="0%" stop-color="#4b545f" />
                  <stop offset="48%" stop-color="#2b333d" />
                  <stop offset="100%" stop-color="#151a21" />
                </radialGradient>
                <linearGradient id="profile-avatar-head" x1="31" y1="14" x2="31" y2="31" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#f0f4fa" />
                  <stop offset="54%" stop-color="#b8c1ce" />
                  <stop offset="100%" stop-color="#8793a4" />
                </linearGradient>
                <linearGradient id="profile-avatar-body" x1="31" y1="32" x2="31" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#d3dae5" />
                  <stop offset="60%" stop-color="#8f9aad" />
                  <stop offset="100%" stop-color="#667286" />
                </linearGradient>
                <linearGradient id="profile-avatar-status" x1="50" y1="43" x2="50" y2="55" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#6df4a4" />
                  <stop offset="100%" stop-color="#24c96e" />
                </linearGradient>
                <clipPath id="profile-avatar-clip">
                  <circle cx="31" cy="31" r="21.6" />
                </clipPath>
              </defs>
              <circle class="profile-avatar-outer-ring" cx="31" cy="31" r="28" />
              <circle class="profile-avatar-mid-ring" cx="31" cy="31" r="24" />
              <circle class="profile-avatar-disc" cx="31" cy="31" r="21.6" />
              <g clip-path="url(#profile-avatar-clip)">
                <circle class="profile-avatar-head" cx="31" cy="23" r="7.2" />
                <path class="profile-avatar-body" d="M13.5 52.5C15.2 40.8 22 34.6 31 34.6s15.8 6.2 17.5 17.9Z" />
              </g>
              <circle class="profile-avatar-status-ring" cx="50" cy="49" r="8" />
              <circle class="profile-avatar-status-core" cx="50" cy="49" r="5" />
            </svg>
          </button>
          <div class="action-menu" id="action-menu" role="menu" aria-hidden="true">
            <button class="action-menu-item profile-menu-item" id="profile-button" type="button" role="menuitem">
              <span class="menu-avatar-icon" aria-hidden="true">
                <span class="menu-avatar-head"></span>
                <span class="menu-avatar-body"></span>
              </span>
              <span>Profile</span>
            </button>
            <button class="action-menu-item" id="settings-button" type="button" role="menuitem">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.3a2 2 0 0 1-4 0V21a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.1 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.7a2 2 0 0 1 0-4H3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7 4.1l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3V2.7a2 2 0 0 1 4 0V3a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.9 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1A1.7 1.7 0 0 0 21 10h.3a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z" />
              </svg>
              <span>Settings</span>
            </button>
            <button class="action-menu-item" id="refresh-button" type="button" role="menuitem">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.5 13.5 13.5 10" />
                <path d="M8.1 16.9 6.7 18.3a4 4 0 0 1-5.7-5.7l3.4-3.4a4 4 0 0 1 5.7 0" />
                <path d="M15.9 7.1 17.3 5.7a4 4 0 0 1 5.7 5.7l-3.4 3.4a4 4 0 0 1-5.7 0" />
              </svg>
              <span>Connect</span>
            </button>
            <button class="action-menu-item" id="privacy-info-button" type="button" role="menuitem">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 10v6" />
                <path d="M12 7h.01" />
              </svg>
              <span>Information</span>
            </button>
          </div>
        </div>
      </header>

      <section class="hero-region" aria-label="Market views">
        <nav class="market-tabs" aria-label="Market views">
          <button class="tab-button is-active" id="related-tab" type="button" data-tab="related">Relevant Markets</button>
          <button class="tab-button" id="trending-tab" type="button" data-tab="trending">Trending</button>
          <button class="tab-button" id="watchlist-tab" type="button" data-tab="watchlist">Watchlist</button>
        </nav>
      </section>

      <section id="status-region" class="status-region" aria-live="polite"></section>
      <section id="surface-message" class="surface-message" role="status" aria-live="polite" hidden></section>
      <section id="results-region" class="results-region" aria-label="Prediction market matches"></section>
    </main>

    <script src="../lib/articleSignals.js"></script>
    <script src="../lib/polymarket.js"></script>
    <script src="../lib/hyperliquid.js"></script>
    <script src="./render.js"></script>
    <script src="../vendor/klinecharts/klinecharts.min.js"></script>
    <script src="./klinecharts.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
